<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>mobileML - Pose (Stable Version)</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

<style>
:root {
    --color-lines: #3b1d4a;
    --color-class-a: #a4c639;
    --color-class-b: #e94e24;
    --color-bg-btn: #7f8c8d;
    --bg-page: #ffffff;
    --text-main: #2d3436;
    --turquoise: #00cec9;
}

body {
    font-family: system-ui, -apple-system, sans-serif;
    background-color: var(--bg-page);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
    box-sizing: border-box;
    overflow-x: hidden;
}

h2 {
    margin: 15px 0 10px 0;
    font-size: 1.3rem;
    color: var(--color-lines);
    font-weight: 800;
}

#video-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    border-radius: 24px;
    overflow: hidden;
    border: 6px solid #f8f9fa;
    aspect-ratio: 1/1;
    background: black;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

video,
canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

video {
    transform: scaleX(-1);
}

canvas {
    z-index: 10;
    pointer-events: none;
    transform: scaleX(-1);
}

#status-bar {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 18px;
    border-radius: 20px;
    margin: 15px 0;
    text-align: center;
    border: 1px solid #eee;
    min-height: 95px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 15px;
    width: 100%;
    max-width: 420px;
}

.setup-btn {
    background: #fff;
    border: 2px solid #f0f0f0;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 700;
    flex: 1;
    cursor: pointer;
}

.training-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 420px;
}

.label-input {
    width: 100%;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 800;
    text-align: center;
    box-sizing: border-box;
}

.train-btn {
    padding: 25px 5px;
    border: none;
    border-radius: 18px;
    font-size: 0.95rem;
    font-weight: bold;
    color: white;
    touch-action: none;
    cursor: pointer;
}

#btn-bg {
    background: var(--color-bg-btn);
    grid-column: span 2;
    margin-top: 5px;
}

#btn-0 {
    background: var(--color-class-a);
    color: #333;
}

#btn-1 {
    background: var(--color-class-b);
}

#loading-overlay {
    position: fixed;
    inset: 0;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 4000;
}
</style>
</head>

<body>

<div id="loading-overlay">
    <p>Loading AI...</p>
</div>

<h2>📱 mobileML - Pose</h2>

<div id="video-container">
    <video autoplay playsinline muted id="webcam"></video>
    <canvas id="canvas"></canvas>
</div>

<div id="status-bar">
    <span id="prediction"
          style="font-size:1.4rem;font-weight:900;">Ready</span><br>

    <span id="confidence"
          style="font-size:0.8rem;color:#666;">
        Need 50 samples each
    </span>
</div>

<div class="toolbar">
    <button class="setup-btn" onclick="toggleCamera()">🔄 Flip</button>
    <button class="setup-btn" onclick="saveModel()">💾 Save</button>
    <button class="setup-btn"
            onclick="document.getElementById('load-file').click()">
        📂 Upload
    </button>
    <button class="setup-btn"
            style="color:red;"
            onclick="resetModel()">
        🗑️ Reset
    </button>

    <input type="file"
           id="load-file"
           style="display:none"
           onchange="loadModel(event)">
</div>

<div class="training-grid">

    <input type="text"
           id="label-0"
           class="label-input"
           value="Class A"
           oninput="updateBtnText(0)">

    <input type="text"
           id="label-1"
           class="label-input"
           value="Class B"
           oninput="updateBtnText(1)">

    <button class="train-btn" id="btn-0">
        HOLD:
        <span id="btn-txt-0">Class A</span><br>
        <span id="count-0">0</span>
    </button>

    <button class="train-btn" id="btn-1">
        HOLD:
        <span id="btn-txt-1">Class B</span><br>
        <span id="count-1">0</span>
    </button>

    <button class="train-btn" id="btn-bg">
        HOLD: Background<br>
        <span id="count-bg">0</span>
    </button>

</div>

<script>

let detector;
let classifier;
let video;
let canvas;
let ctx;

let latestPose = null;

let counts = {
    0: 0,
    1: 0,
    bg: 0
};

let isPredicting = false;
let isLoadingModel = false;

let currentFacingMode = 'user';

const reusableInput = new Float32Array(34);

async function setupWebcam() {

    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: currentFacingMode,
            width: 360,
            height: 360
        },
        audio: false
    });

    video.srcObject = stream;

    return new Promise(resolve => {
        video.onloadedmetadata = resolve;
    });
}

async function init() {

    video = document.getElementById('webcam');
    canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');

    await tf.ready();

    await tf.setBackend('webgl');

    classifier = knnClassifier.create();

    try {

        detector = await poseDetection.createDetector(
            poseDetection.SupportedModels.MoveNet,
            {
                modelType:
                    poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
            }
        );

        await setupWebcam();

        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        document.getElementById('loading-overlay').style.display = 'none';

        renderLoop();

        setInterval(processML, 100);

    } catch (e) {

        console.error(e);
        alert("Error loading AI");

    }
}

function renderLoop() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (latestPose) {
        drawPose(latestPose);
    }

    requestAnimationFrame(renderLoop);
}

async function processML() {

    if (
        isLoadingModel ||
        isPredicting ||
        video.readyState !== 4
    ) {
        return;
    }

    try {

        const poses = await detector.estimatePoses(video);

        if (poses.length > 0) {

            latestPose = poses[0];

            if (classifier.getNumClasses() > 0) {
                runInference(latestPose);
            }
        }

    } catch (err) {

        console.error("Pose detection error", err);

    }
}

function drawPose(pose) {

    pose.keypoints.forEach(kp => {

        if (kp.score > 0.4) {

            ctx.beginPath();

            ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);

            ctx.fillStyle = "#00cec9";

            ctx.fill();
        }
    });
}

async function runInference(pose) {

    isPredicting = true;

    try {

        for (let i = 0; i < 17; i++) {

            reusableInput[i * 2] =
                pose.keypoints[i].x;

            reusableInput[i * 2 + 1] =
                pose.keypoints[i].y;
        }

        const feat = tf.tensor2d(reusableInput, [1, 34]);

        const result = await classifier.predictClass(feat);

        feat.dispose();

        if (result) {

            const label = result.label;

            const conf =
                Math.floor(
                    result.confidences[label] * 100
                );

            const name =
                label === 'bg'
                    ? 'Neutral'
                    : document.getElementById(
                        'label-' + label
                    ).value;

            document.getElementById('prediction')
                .innerText = name.toUpperCase();

            document.getElementById('confidence')
                .innerText = conf + "% Confidence";
        }

    } catch (err) {

        console.error("Inference Error", err);

    } finally {

        isPredicting = false;

    }
}

async function train(id) {

    if (isLoadingModel) return;

    try {

        const poses =
            await detector.estimatePoses(video);

        if (poses.length > 0) {

            for (let i = 0; i < 17; i++) {

                reusableInput[i * 2] =
                    poses[0].keypoints[i].x;

                reusableInput[i * 2 + 1] =
                    poses[0].keypoints[i].y;
            }

            const feat =
                tf.tensor2d(reusableInput, [1, 34]);

            classifier.addExample(feat, id);

            feat.dispose();

            counts[id]++;

            document.getElementById(
                'count-' + id
            ).innerText = counts[id];
        }

    } catch (err) {

        console.error("Training error", err);

    }
}

async function loadModel(event) {

    isLoadingModel = true;

    document.getElementById('prediction')
        .innerText = "LOADING...";

    try {

        const file = event.target.files[0];

        const reader = new FileReader();

        reader.onload = async (e) => {

            try {

                const content =
                    JSON.parse(e.target.result);

                classifier.clearAllClasses();

                await tf.nextFrame();

                const dataset = {};

                for (const [label, data, shape]
                    of content.data) {

                    await tf.nextFrame();

                    dataset[label] =
                        tf.tensor2d(data, shape);
                }

                classifier.setClassifierDataset(dataset);

                counts =
                    content.counts ||
                    {0:50,1:50,bg:50};

                document.getElementById('label-0')
                    .value = content.labels[0];

                document.getElementById('label-1')
                    .value = content.labels[1];

                updateBtnText(0);
                updateBtnText(1);

                document.getElementById('prediction')
                    .innerText = "READY";

                alert("Model Loaded!");

            } catch (err) {

                console.error(err);

                alert("Failed to load model");

            } finally {

                isLoadingModel = false;
            }
        };

        reader.readAsText(file);

    } catch (err) {

        console.error(err);

        isLoadingModel = false;

    }
}

function saveModel() {

    const dataset =
        classifier.getClassifierDataset();

    const datasetObj =
        Object.entries(dataset).map(([l, d]) => [
            l,
            Array.from(d.dataSync()),
            d.shape
        ]);

    const blob = new Blob([
        JSON.stringify({
            data: datasetObj,
            labels: [
                document.getElementById('label-0').value,
                document.getElementById('label-1').value
            ],
            counts: counts
        })
    ], {
        type: "application/json"
    });

    const a = document.createElement('a');

    a.href = URL.createObjectURL(blob);

    a.download = "my_model.json";

    a.click();
}

function updateBtnText(id) {

    document.getElementById(
        'btn-txt-' + id
    ).innerText =
        document.getElementById(
            'label-' + id
        ).value;
}

function resetModel() {

    location.reload();
}

async function toggleCamera() {

    currentFacingMode =
        currentFacingMode === 'user'
            ? 'environment'
            : 'user';

    await setupWebcam();

    await video.play();
}

let timer;

['0', '1', 'bg'].forEach(id => {

    const b =
        document.getElementById('btn-' + id);

    b.addEventListener('pointerdown', (e) => {

        e.preventDefault();

        timer =
            setInterval(() => train(id), 120);
    });

    b.addEventListener('pointerup', () => {

        clearInterval(timer);
    });

    b.addEventListener('pointerleave', () => {

        clearInterval(timer);
    });
});

init();

</script>

</body>
</html>
