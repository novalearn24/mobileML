<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Pose Studio Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

    <style>
        :root { --neon: #00ffcc; --hotpink: #ff00ff; --bg: #050505; --card: #121212; }
        
        body { 
            margin: 0; background: var(--bg); color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* The Status Banner */
        header { 
            width: 100%; padding: 20px 0; background: linear-gradient(to bottom, #1a1a1a, var(--bg));
            text-align: center; border-bottom: 1px solid #333;
        }
        #status-msg { 
            font-size: 0.8rem; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 2px; color: var(--neon); margin-top: 5px;
        }

        /* The Video Container */
        #viewport { 
            position: relative; width: 92vw; height: 92vw; max-width: 480px; max-height: 480px;
            margin: 20px 0; border-radius: 24px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(0,255,204,0.1);
            border: 2px solid #222; background: #000;
        }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.8; }
        canvas { position: absolute; width: 100%; height: 100%; z-index: 10; transform: scaleX(-1); }

        /* The Pose Ribbon (Underneath/Over Video) */
        #prediction-ribbon {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 255, 204, 0.9); color: black; padding: 10px 30px;
            border-radius: 50px; font-weight: 900; font-size: 1.2rem;
            z-index: 20; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none; white-space: nowrap;
        }

        /* Dashboard & Controls */
        .grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            width: 92vw; max-width: 480px; padding-bottom: 40px;
        }
        .control-card { 
            background: var(--card); padding: 20px 15px; border-radius: 20px; 
            border: 1px solid #222; text-align: center;
        }
        .count-badge { font-size: 1.8rem; font-weight: 900; color: white; display: block; margin-bottom: 5px; }
        .label { font-size: 0.65rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        .btn { 
            width: 100%; border: none; border-radius: 12px; padding: 18px 0;
            color: white; font-weight: 800; font-size: 0.9rem; cursor: pointer;
            transition: transform 0.1s, filter 0.2s; touch-action: none;
        }
        .btn:active { transform: scale(0.96); filter: brightness(1.2); }
        
        .btn-a { background: #007bff; }
        .btn-b { background: #6f42c1; }
        .btn-bg { background: #333; }
        
        .footer-tools { 
            grid-column: span 2; display: flex; gap: 10px; margin-top: 10px;
        }
        .btn-tool { background: #222; padding: 12px; font-size: 0.7rem; color: #aaa; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 1.2rem;">POSE<span style="color:var(--neon)">STUDIO</span></div>
    <div id="status-msg">Waking up AI...</div>
</header>

<div id="viewport">
    <div id="prediction-ribbon">POSE: <span id="res-label">---</span></div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<div class="grid">
    <div class="control-card">
        <span class="count-badge" id="c0">0</span>
        <div class="label">Class A Pose</div>
        <button class="btn btn-a" id="btn-0">TRAIN A</button>
    </div>

    <div class="control-card">
        <span class="count-badge" id="c1">0</span>
        <div class="label">Class B Pose</div>
        <button class="btn btn-b" id="btn-1">TRAIN B</button>
    </div>

    <div class="control-card" style="grid-column: span 2;">
        <span class="count-badge" id="cbg">0</span>
        <div class="label">Background / Neutral</div>
        <button class="btn btn-bg" id="btn-bg">TRAIN BACKGROUND</button>
    </div>

    <div class="footer-tools">
        <button class="btn btn-tool" onclick="saveModel()">DOWNLOAD BRAIN</button>
        <button class="btn btn-tool" onclick="document.getElementById('loader').click()">LOAD BRAIN</button>
        <input type="file" id="loader" style="display:none" onchange="loadModel(event)">
    </div>
</div>

<script>
    let detector, classifier, video, canvas, ctx;
    let counts = {0:0, 1:0, bg:0};

    async function init() {
        video = document.getElementById('webcam');
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');
        classifier = knnClassifier.create();

        try {
            const model = poseDetection.SupportedModels.MoveNet;
            detector = await poseDetection.createDetector(model);
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                document.getElementById('status-msg').innerText = "AI Ready • Step Back";
                loop();
            };
        } catch (e) { document.getElementById('status-msg').innerText = "Error: Check Permissions"; }
    }

    async function loop() {
        const poses = await detector.estimatePoses(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (poses.length > 0) {
            const pose = poses[0];
            
            // Draw Pro Dots
            pose.keypoints.forEach(kp => {
                if (kp.score > 0.3) {
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, 12, 0, 2 * Math.PI);
                    ctx.fillStyle = "#ff00ff"; // Hot Pink Dots
                    ctx.fill();
                    ctx.strokeStyle = "white";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
            });

            // Prediction Logic
            if (classifier.getNumClasses() > 0) {
                const feat = tf.tensor2d(pose.keypoints.map(k => [k.x, k.y]).flat(), [1, 34]);
                const res = await classifier.predictClass(feat);
                if (res.confidences[res.label] > 0.7) {
                    document.getElementById('prediction-ribbon').style.display = "block";
                    document.getElementById('res-label').innerText = res.label.toUpperCase();
                }
                feat.dispose();
            }
        }
        requestAnimationFrame(loop);
    }

    async function train(id) {
        const poses = await detector.estimatePoses(video);
        if (poses.length > 0) {
            const feat = tf.tensor2d(poses[0].keypoints.map(k => [k.x, k.y]).flat(), [1, 34]);
            classifier.addExample(feat, id);
            counts[id]++;
            document.getElementById('c'+id).innerText = counts[id];
            feat.dispose();
        }
    }

    function saveModel() {
        const dataset = classifier.getClassifierDataset();
        const datasetObj = Object.entries(dataset).map(([label, data]) => [label, Array.from(data.dataSync()), data.shape]);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(datasetObj)], {type: "application/json"}));
        a.download = "pose_model.json"; a.click();
    }

    async function loadModel(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const datasetObj = JSON.parse(e.target.result);
            const dataset = Object.fromEntries(datasetObj.map(([label, data, shape]) => [label, tf.tensor2d(data, shape)]));
            classifier.setClassifierDataset(dataset);
            document.getElementById('status-msg').innerText = "Brain Loaded!";
        };
        reader.readAsText(event.target.files[0]);
    }

    let timer;
    ['0', '1', 'bg'].forEach(id => {
        const b = document.getElementById('btn-'+id);
        const start = (e) => { e.preventDefault(); timer = setInterval(() => train(id), 100); };
        const stop = () => clearInterval(timer);
        b.addEventListener('touchstart', start); b.addEventListener('touchend', stop);
        b.addEventListener('mousedown', start); b.addEventListener('mouseup', stop);
    });

    init();
</script>
</body>
</html>
